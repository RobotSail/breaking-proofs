[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "breaking-proofs"
version = "0.1.0"
description = "Exact-arithmetic RS proximity oracle and counterexample search for the Proximity Prize"
requires-python = ">=3.11"
dependencies = [
    "galois>=0.4.1",
    "structlog>=24.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "ruff>=0.5",
]

[project.scripts]
breaking-proofs = "breaking_proofs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
