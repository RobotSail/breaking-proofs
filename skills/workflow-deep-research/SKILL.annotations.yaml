study:
  type: Study
  id: study
  command: factory study {project_path}
  writes:
  - .factory/strategy/observations.md
  edges_out:
  - target: decomposer
    condition: null
decomposer:
  type: AgentNode
  id: decomposer
  role: researcher
  blocking: 'true'
  reads:
  - .factory/strategy/observations.md
  writes:
  - .factory/strategy/research-directions.md
  edges_out:
  - target: deep_researcher
    condition: null
  slots:
    task_prompt_decomposer: 'You are the Research Decomposer. Produce 3-5 research
      directions tailored to the current mode and project context.


      Read:

      - The CEO''s task (contains the original prompt and mode context)

      - .factory/strategy/observations.md (if exists — project state)

      - .factory/config.json (if exists — project config, research_target)


      Based on what you find, determine the research context:

      - New project (no .factory/) → web-focused directions (similar, tech, pitfalls)

      - Existing project, improve → mixed directions (internal assessment first, then
      targeted external search for weak dimensions)

      - Factory itself, create mode → code-focused directions (read existing patterns,
      parse mode intent, minimal web for novel patterns only)

      - Research target configured → failure-focused directions (within mutable surfaces)


      For each direction, write:


      ### Direction N: [title]

      - **What to research:** specific question, not generic

      - **Why it matters:** how this connects to the original prompt and project

      - **Type:** internal (code/project reading), external (web search), or mixed

      - **Coverage signal:** how the researcher knows this direction is adequately
      covered


      Rules:

      - Directions must be derived from the ORIGINAL PROMPT

      - If the project already uses pytest, don''t direct ''research testing frameworks''

      - Each direction should produce findings the strategist can act on

      - 3-5 directions maximum

      - Specify type (internal/external/mixed) so the researcher knows whether to
      read code or search the web


      Write to .factory/strategy/research-directions.md

      Read: .factory/strategy/observations.md

      Write output to: .factory/strategy/research-directions.md'
    timeout_decomposer: '120'
deep_researcher:
  type: AgentNode
  id: deep_researcher
  role: researcher
  blocking: 'true'
  reads:
  - .factory/strategy/observations.md
  - .factory/strategy/research-directions.md
  writes:
  - .factory/strategy/research-combined.md
  edges_out:
  - target: gate_coverage
    condition: null
  slots:
    task_prompt_deep_researcher: 'You are the Deep Researcher — a single agent performing
      iterative, coverage-checked research. You have access to WebSearch and WebFetch.
      Your job is to produce a comprehensive, faithful research report by performing
      multiple rounds of search internally.


      ## ORIGINAL PROMPT


      The research topic is provided in the CEO''s task. Read it carefully — this
      is the anchor for ALL your research. Every finding must trace back to this prompt.


      ## RESEARCH PROTOCOL — FOLLOW EXACTLY


      ### Phase 1: Internal Research (FIRST — before any web search)


      Read internal project state to understand what already exists:

      - Read .factory/strategy/observations.md from factory study

      - Check .factory/archive/ for prior knowledge, past experiments, learnings

      - Read .factory/strategy/backlog.md if it exists

      - Understand frameworks, patterns, and constraints the project already uses

      - If research_target is configured in .factory/config.json, read mutable_surfaces,
      fixed_surfaces, and constraints


      Write a summary of what you found internally. This shapes your external search.


      ### Phase 2: Read Research Directions


      Read .factory/strategy/research-directions.md — the decomposer has already generated
      3-5 research directions for you.

      - These are your sub-questions — follow them

      - Note each direction''s type (internal/external/mixed)

      - You may add follow-up sub-questions in later iterations based on gaps, but
      initial directions come from the decomposer


      ### Phase 3: External Search


      For each direction marked external or mixed:

      - Run 3-5 WebSearch queries with varied phrasing

      - WebFetch the 2-3 most promising pages from the results

      - Extract concrete findings: techniques, patterns, code examples, pitfalls

      - Note the source URL for every finding

      For internal directions: read the specified code/files instead of searching.

      Don''t search for things the project already has.


      ### Phase 4: Synthesize Running Report


      Merge external findings with internal state into a structured report:

      - Organize by topic, not by search query or direction number

      - Connect each external finding to something concrete in the codebase

      - Generic advice without project grounding is noise — cut it


      ### Phase 5: Faithfulness Check (MANDATORY — every iteration)


      After each search round, answer these three questions honestly:


      1. **Relevance:** ''Does this finding help answer the ORIGINAL PROMPT, or did
      I follow an interesting tangent?'' — if tangent, discard and refocus


      2. **Grounding:** ''Is this finding connected to something concrete in the codebase,
      or is it generic advice?'' — generic advice without project grounding is noise


      3. **Drift detection:** ''Are my follow-up sub-questions derived from the ORIGINAL
      PROMPT, or derived from previous search results?'' — if next sub-question wouldn''t
      make sense without reading previous results, you''re drifting


      **Hard rule:** If 2 of last 3 search rounds fail the relevance check, STOP that
      direction. Return to Phase 2 and pick the next direction.


      ### Phase 6: Coverage Check


      After completing a search round, evaluate:

      - Check each direction from research-directions.md: adequately covered?

      - If gaps remain → go back to Phase 3 with targeted sub-questions for the gaps

      - If coverage is sufficient → proceed to Phase 7

      - If two consecutive rounds produce no new findings → finalize (diminishing
      returns)

      - If you''ve used ~25 WebSearch calls total → finalize (search budget exhausted)


      ### Phase 7: Final Report Check


      Before writing the final output:

      1. Re-read the original prompt verbatim

      2. For each section in your report, write one sentence explaining how it answers
      the original prompt — if you can''t write that sentence, cut the section

      3. Verify every claim cites a source: URL (external) or file path (internal)
      — unsourced claims are low-confidence, mark them as such


      ## OUTPUT


      Write the complete research report to .factory/strategy/research-combined.md


      Structure:

      - **Research Topic:** (restate the original prompt)

      - **Internal Context:** (summary of project state relevant to the topic)

      - **Findings by Topic:** (organized sections, each with citations)

      - **Gaps & Limitations:** (what you couldn''t find or didn''t cover)

      - **Recommendations:** (actionable next steps grounded in findings)


      ## RELOOP HANDLING


      If .factory/strategy/research-combined.md already exists (from a prior iteration
      due to CEO gate RELOOP), read it as your starting report. Read .factory/reviews/ceo-verdict-coverage.md
      for the CEO''s gap analysis. Focus on filling the specific gaps identified —
      do NOT restart from scratch.

      Read: .factory/strategy/observations.md, .factory/strategy/research-directions.md

      Write output to: .factory/strategy/research-combined.md'
    timeout_deep_researcher: '1800'
gate_coverage:
  type: GateNode
  id: gate_coverage
  evaluator_type: agent
  evaluator_role: ceo
  reads:
  - .factory/strategy/research-combined.md
  - .factory/strategy/research-directions.md
  edges_out:
  - target: deep_researcher
    condition: RELOOP
  slots:
    gate_prompt_gate_coverage: 'Check the deep research report against the research
      directions.


      Read .factory/strategy/research-directions.md (what was asked for) and .factory/strategy/research-combined.md
      (what was produced).


      For each direction the decomposer specified:

      1. Is it covered in the research report?

      2. Is the coverage adequate (actually researched, not just mentioned)?

      3. Did the researcher stay within the direction''s scope?


      Also check:

      4. Does the report trace back to the original prompt?

      5. Are findings grounded (connected to codebase, not generic advice)?

      6. Are claims cited with URLs or file paths?


      PROCEED if all directions are covered.

      RELOOP listing which directions are missing or inadequately covered.'
    max_iterations_gate_coverage: '3'
