study:
  type: Study
  id: study
  command: factory study {project_path}
  writes:
  - .factory/strategy/observations.md
  edges_out:
  - target: strategist
    condition: null
strategist:
  type: AgentNode
  id: strategist
  role: strategist
  blocking: 'true'
  reads:
  - .factory/strategy/observations.md
  writes:
  - .factory/strategy/current.md
  edges_out:
  - target: builder
    condition: null
  slots:
    task_prompt_strategist: 'Pick ONE high-leverage hypothesis to prototype. Read
      observations at .factory/strategy/observations.md. Skip FEEC classification
      and backlog grooming — just pick the most promising idea and write it to .factory/strategy/current.md.
      Keep it scoped: one idea, one PR, fast to implement.

      Read: .factory/strategy/observations.md

      Write output to: .factory/strategy/current.md'
    timeout_strategist: '600'
builder:
  type: AgentNode
  id: builder
  role: builder
  blocking: 'true'
  reads:
  - .factory/strategy/current.md
  writes:
  - .factory/reviews/builder-latest.md
  edges_out:
  - target: gate_tests
    condition: null
  slots:
    task_prompt_builder: 'Prototype the hypothesis from .factory/strategy/current.md.
      Read CLAUDE.md and factory.md for project context. Prioritize getting something
      working over code quality. Skip edge cases and comprehensive error handling.
      Run tests to verify it works. Commit the changes.

      Read: .factory/strategy/current.md

      Write output to: .factory/reviews/builder-latest.md'
    timeout_builder: '1200'
gate_tests:
  type: GateNode
  id: gate_tests
  evaluator_type: fn
  evaluator_command: cd {project_path} && python -m pytest --tb=short -q 2>&1 && ruff
    check . 2>&1
  reads:
  - .factory/reviews/builder-latest.md
  edges_out:
  - target: finalize
    condition: PROCEED
  - target: builder
    condition: RELOOP
  slots:
    max_iterations_gate_tests: '3'
finalize:
  type: FnNode
  id: finalize
  command: factory finalize {project_path} --id $EXP_ID --verdict $VERDICT --hypothesis
    "$HYPOTHESIS" --force
  reads:
  - .factory/reviews/builder-latest.md
  writes:
  - .factory/experiments/verdict.json
  edges_out: []
  slots:
    finalize_command_finalize: factory finalize $PROJECT_PATH --id $EXP_ID --verdict
      $VERDICT --hypothesis "$HYPOTHESIS" --force
