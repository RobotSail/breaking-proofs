gate_has_factory:
  type: GateNode
  id: gate_has_factory
  evaluator_type: fn
  evaluator_command: python3 -c "from pathlib import Path; exists = Path("{project_path}/.factory/config.json").exists();
    print("PROCEED" if exists else "HALT")"
  reads:
  - .factory/config.json
  edges_out:
  - target: graph_update
    condition: PROCEED
  - target: discover
    condition: HALT
discover:
  type: FnNode
  id: discover
  command: factory discover {project_path}
  reads: []
  writes:
  - .factory/eval_profile.json
  edges_out:
  - target: graph_update
    condition: null
graph_update:
  type: FnNode
  id: graph_update
  command: factory graph update {project_path}
  reads: []
  writes:
  - graph.json
  edges_out:
  - target: study
    condition: null
study:
  type: Study
  id: study
  command: factory study {project_path}
  writes:
  - .factory/strategy/observations.md
  edges_out:
  - target: graph_explorer
    condition: null
graph_explorer:
  type: AgentNode
  id: graph_explorer
  role: researcher
  blocking: 'true'
  reads:
  - .factory/strategy/observations.md
  writes:
  - .factory/strategy/graph-context.md
  edges_out:
  - target: concat_study
    condition: null
  slots:
    task_prompt_graph_explorer: 'Explore the project''s code knowledge graph to build
      structural understanding. Read .factory/strategy/observations.md for focus context.


      If graphify is installed and graph.json exists:

      1. Run `factory graph query "<focus from observations>" --depth 2` to find relevant
      nodes

      2. Run `factory graph explain "<key node>"` on the most important nodes to understand
      their connections and dependencies

      3. Run `factory graph path "<A>" "<B>"` to trace dependency paths between key
      components

      4. Write structured findings to .factory/strategy/graph-context.md covering:
      key modules and their relationships, dependency paths, architectural layers,
      entry points and hotspots


      If graphify is NOT installed or graph.json is missing, fall back to direct file
      exploration:

      1. Use `find . -name ''*.py'' | head -50` to discover source files

      2. Use `grep -rn ''class \|def '' --include=''*.py'' | head -100` to map functions
      and classes

      3. Use `grep -rn ''import '' --include=''*.py'' | head -100` to trace dependencies

      4. Write the same structured findings to .factory/strategy/graph-context.md

      Read: .factory/strategy/observations.md

      Write output to: .factory/strategy/graph-context.md'
    timeout_graph_explorer: '600'
concat_study:
  type: FnNode
  id: concat_study
  command: cat {project_path}/.factory/strategy/observations.md {project_path}/.factory/strategy/graph-context.md
    > {project_path}/.factory/strategy/study-combined.md
  reads:
  - .factory/strategy/graph-context.md
  - .factory/strategy/observations.md
  writes:
  - .factory/strategy/study-combined.md
  edges_out:
  - target: check_prior_plans
    condition: null
check_prior_plans:
  type: GateNode
  id: check_prior_plans
  evaluator_type: fn
  evaluator_command: ': > "{project_path}/.factory/strategy/prior-plans.md"; if [
    -n "$FOCUS" ]; then   if gh auth status >/dev/null 2>&1 && git remote -v 2>/dev/null
    | grep -q .; then     gh issue list --label plan --search "$FOCUS" --json number,title,url       --jq
    ".[] | \"#\(.number) \(.title) — \(.url)\""       > "{project_path}/.factory/strategy/prior-plans.md"
    2>/dev/null || true;   fi;   if [ ! -s "{project_path}/.factory/strategy/prior-plans.md"
    ]; then     grep -Frl "$FOCUS" "{project_path}/.factory/archive/" --include="plan-*.md"       >>
    "{project_path}/.factory/strategy/prior-plans.md" 2>/dev/null || true;   fi; fi;
    [ -s "{project_path}/.factory/strategy/prior-plans.md" ]'
  reads: []
  edges_out:
  - target: gate_prior_plans
    condition: PROCEED
  - target: fork_research
    condition: HALT
gate_prior_plans:
  type: GateNode
  id: gate_prior_plans
  evaluator_type: user
  reads:
  - .factory/strategy/prior-plans.md
  edges_out:
  - target: fork_research
    condition: PROCEED
fork_research:
  type: ForkNode
  id: fork_research
  targets: researcher_similar,researcher_techstack,researcher_pitfalls
  edges_out:
  - target: researcher_similar
    condition: null
  - target: researcher_techstack
    condition: null
  - target: researcher_pitfalls
    condition: null
researcher_similar:
  type: AgentNode
  id: researcher_similar
  role: researcher
  blocking: 'true'
  reads:
  - .factory/strategy/study-combined.md
  writes:
  - .factory/strategy/research-similar.md
  edges_out:
  - target: join_research
    condition: null
  slots:
    task_prompt_researcher_similar: 'Similar projects research. Read .factory/strategy/study-combined.md
      for project context (observations + structural graph analysis). Search the web
      for similar projects, existing solutions, and prior art. Analyze their strengths,
      weaknesses, and market positioning. Check .factory/archive/ for prior knowledge
      on similar builds. Write findings to .factory/strategy/research-similar.md covering:
      similar projects found (with links), what they do well and what''s missing,
      differentiation opportunities.

      Read: .factory/strategy/study-combined.md

      Write output to: .factory/strategy/research-similar.md'
    timeout_researcher_similar: '600'
researcher_techstack:
  type: AgentNode
  id: researcher_techstack
  role: researcher
  blocking: 'true'
  reads:
  - .factory/strategy/study-combined.md
  writes:
  - .factory/strategy/research-techstack.md
  edges_out:
  - target: join_research
    condition: null
  slots:
    task_prompt_researcher_techstack: 'Tech stack research. Read .factory/strategy/study-combined.md
      for project context (observations + structural graph analysis). Identify the
      best technology stack for this type of project. Find architecture patterns and
      best practices. Evaluate framework/library options with trade-offs. Write findings
      to .factory/strategy/research-techstack.md covering: recommended tech stack
      with rationale, architecture patterns, framework comparisons.

      Read: .factory/strategy/study-combined.md

      Write output to: .factory/strategy/research-techstack.md'
    timeout_researcher_techstack: '600'
researcher_pitfalls:
  type: AgentNode
  id: researcher_pitfalls
  role: researcher
  blocking: 'true'
  reads:
  - .factory/strategy/study-combined.md
  writes:
  - .factory/strategy/research-pitfalls.md
  edges_out:
  - target: join_research
    condition: null
  slots:
    task_prompt_researcher_pitfalls: 'Pitfalls and scope research. Read .factory/strategy/study-combined.md
      for project context (observations + structural graph analysis). Identify potential
      pitfalls and common mistakes for this type of project. Research MVP scope best
      practices. Check .factory/archive/ for lessons from past builds. Write findings
      to .factory/strategy/research-pitfalls.md covering: potential pitfalls to avoid,
      MVP scope recommendation, lessons from similar past builds.

      Read: .factory/strategy/study-combined.md

      Write output to: .factory/strategy/research-pitfalls.md'
    timeout_researcher_pitfalls: '600'
join_research:
  type: JoinNode
  id: join_research
  sources: researcher_similar,researcher_techstack,researcher_pitfalls
  reads: []
  writes: []
  edges_out:
  - target: gate_research
    condition: null
gate_research:
  type: GateNode
  id: gate_research
  evaluator_type: agent
  evaluator_role: ceo
  reads:
  - .factory/strategy/research-pitfalls.md
  - .factory/strategy/research-similar.md
  - .factory/strategy/research-techstack.md
  edges_out:
  - target: strategist
    condition: PROCEED
  - target: fork_research
    condition: RELOOP
  slots:
    gate_prompt_gate_research: Is the research relevant? Does it cover the technology
      landscape adequately? Check for gaps in similar projects, tech stack analysis,
      and pitfall coverage.
    max_iterations_gate_research: '3'
strategist:
  type: AgentNode
  id: strategist
  role: strategist
  blocking: 'true'
  reads:
  - .factory/strategy/research-pitfalls.md
  - .factory/strategy/research-similar.md
  - .factory/strategy/research-techstack.md
  - .factory/strategy/study-combined.md
  writes:
  - .factory/strategy/current.md
  edges_out:
  - target: gate_strategy
    condition: null
  slots:
    task_prompt_strategist: 'Synthesize a project specification from study and research.
      If .factory/strategy/study-combined.md exists, read it for project observations
      and structural graph analysis. Read ALL research files at .factory/strategy/research-similar.md,
      research-techstack.md, and research-pitfalls.md. Produce a complete phased build
      plan. Phase 1 must be project scaffold + eval harness. Every Phase must have
      substantive What/Why/Expected impact fields. Build EVERYTHING in this pass.
      Only defer items requiring human intervention. Write the plan to .factory/strategy/current.md.

      Read: .factory/strategy/research-pitfalls.md, .factory/strategy/research-similar.md,
      .factory/strategy/research-techstack.md, .factory/strategy/study-combined.md

      Write output to: .factory/strategy/current.md'
    timeout_strategist: '600'
gate_strategy:
  type: GateNode
  id: gate_strategy
  evaluator_type: user
  reads:
  - .factory/strategy/current.md
  edges_out:
  - target: strategist
    condition: RELOOP
  - target: publish_github
    condition: PROCEED
  slots:
    max_iterations_gate_strategy: '3'
publish_github:
  type: FnNode
  id: publish_github
  command: 'bash -c ''set -e; echo "none" > "{project_path}/.factory/strategy/github-issue-ref.txt";
    if ! gh auth status >/dev/null 2>&1; then   echo "SKIP: gh not authenticated —
    plan saved locally only"; exit 0; fi; if ! git rev-parse --is-inside-work-tree
    >/dev/null 2>&1; then   echo "SKIP: not inside a git repository"; exit 0; fi;
    if ! git remote -v 2>/dev/null | grep -q .; then   SLUG=$(basename "{project_path}");   echo
    "Creating GitHub repository: $SLUG...";   if gh repo create "$SLUG" --public --source=.
    --remote=origin --push 2>&1; then     REPO_URL=$(gh repo view "$SLUG" --json url
    -q .url 2>/dev/null || echo "");     echo "GitHub repository created: ${REPO_URL:-$SLUG}";   elif
    gh repo view "$SLUG" >/dev/null 2>&1; then     echo "Repository $SLUG already
    exists on GitHub, linking as remote...";     REMOTE_URL=$(gh repo view "$SLUG"
    --json sshUrl -q .sshUrl 2>/dev/null ||       gh repo view "$SLUG" --json url
    -q .url);     git remote add origin "$REMOTE_URL" 2>/dev/null || true;     git
    push -u origin HEAD 2>/dev/null || true;   else     echo "SKIP: could not create
    GitHub repo — plan saved locally only"; exit 0;   fi; fi; gh label create plan
    --description "Approved plan" --color 0366d6 --force 2>/dev/null || true; FOCUS="${FOCUS:-}";
    ISSUE_NUM=""; if echo "$FOCUS" | grep -qE "^[0-9]+$"; then   ISSUE_NUM="$FOCUS";
    elif echo "$FOCUS" | grep -qoE "#([0-9]+)"; then   ISSUE_NUM=$(echo "$FOCUS" |
    grep -oE "[0-9]+" | tail -1); fi; if [ -n "$ISSUE_NUM" ]; then   gh issue comment
    "$ISSUE_NUM" --body-file "{project_path}/.factory/strategy/current.md";   gh issue
    edit "$ISSUE_NUM" --add-label plan;   echo "$ISSUE_NUM" > "{project_path}/.factory/strategy/github-issue-ref.txt";   echo
    "Plan posted to issue #$ISSUE_NUM"; else   TITLE="Plan: ${FOCUS:-project}";   ISSUE_URL=$(gh
    issue create --title "$TITLE" --body-file "{project_path}/.factory/strategy/current.md"
    --label plan);   ISSUE_NUM=$(echo "$ISSUE_URL" | grep -oE "[0-9]+$");   echo "$ISSUE_NUM"
    > "{project_path}/.factory/strategy/github-issue-ref.txt";   echo "Created plan
    issue: $ISSUE_URL"; fi'''
  reads:
  - .factory/strategy/current.md
  writes:
  - .factory/strategy/github-issue-ref.txt
  edges_out:
  - target: seed_backlog
    condition: null
seed_backlog:
  type: FnNode
  id: seed_backlog
  command: 'python3 -c "import re, os; project = ''{project_path}''; plan = open(f''{project}/.factory/strategy/current.md'').read();
    ref_file = f''{project}/.factory/strategy/github-issue-ref.txt''; issue_num =
    open(ref_file).read().strip() if os.path.exists(ref_file) else ''none''; ref =
    f''(see #{issue_num})'' if issue_num != ''none'' else ''(see .factory/strategy/current.md)'';
    phases = re.findall(r''### Phase \d+:.*'', plan); backlog_path = f''{project}/.factory/strategy/backlog.md'';
    items = ''\n''.join(f''- [ ] {p[4:]} {ref}'' for p in phases); open(backlog_path,
    ''a'').write(''\n'' + items + ''\n'') if items else None; print(f''Seeded {len(phases)}
    backlog items from plan'')"'
  reads:
  - .factory/strategy/current.md
  - .factory/strategy/github-issue-ref.txt
  writes:
  - .factory/strategy/backlog.md
  edges_out: []
